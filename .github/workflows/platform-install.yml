name: Platform installed packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# No concurrency block here. This workflow is called from validate.yml, whose
# own group already runs one main validation at a time. A second, nested group
# with `queue: max` coincided with every main run from 2026-10-19 05:13Z being
# cancelled a few minutes after it started while several runs were queued.

jobs:
  platform-install:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      # Run one platform at a time to share runner capacity; all three platform checks still run.
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      # Node for the installed workspace browser check (built-in fetch and WebSocket);
      # the same version as validate.yml. The runners' preinstalled Chrome is used.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.19.0"
      # meshloom's compiled kernel: the toolchain pinned in packages/meshloom/rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rust-src --no-self-update
      - name: Install existing portable validation pins
        run: python -m pip install -r tools/requirements-py312-windows-thermal.txt
      - name: Build sdists and wheels and validate fresh installed consumer
        run: python -X utf8 tools/check_platform_install.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: installed-packages-${{ matrix.os }}-${{ github.run_id }}
          path: .validation-platform/
          include-hidden-files: true
          if-no-files-found: error
