name: Platform installed packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  queue: ${{ github.ref == 'refs/heads/main' && 'max' || 'single' }}

jobs:
  platform-install:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      # Share runner capacity with Wavebit while retaining all three platform checks.
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Install existing portable validation pins
        run: python -m pip install -r ci/requirements-py312-windows-thermal.txt
      - name: Build sdists and wheels and validate fresh installed consumer
        run: python -X utf8 ci/tools/check_platform_install.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-packages-${{ matrix.os }}-${{ github.run_id }}
          path: .validation-platform/
          include-hidden-files: true
          if-no-files-found: error
