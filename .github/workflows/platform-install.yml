name: Platform installed packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# No concurrency block here. This workflow is called from validate.yml, whose
# own group already runs one main validation at a time. A second, nested group
# with `queue: max` coincided with every main run from 2026-10-19 05:13Z being
# cancelled a few minutes after it started while several runs were queued.

jobs:
  platform-install:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      # Run one platform at a time to share runner capacity; all three platform checks still run.
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      # meshloom's compiled kernel: the toolchain pinned in packages/meshloom/rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rust-src --no-self-update
      - name: Install existing portable validation pins
        run: python -m pip install -r tools/requirements-py312-windows-thermal.txt
      - name: Build sdists and wheels and validate fresh installed consumer
        run: python -X utf8 tools/check_platform_install.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-packages-${{ matrix.os }}-${{ github.run_id }}
          path: .validation-platform/
          include-hidden-files: true
          if-no-files-found: error
