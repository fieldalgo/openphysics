# Publishes the nine distributions to PyPI when a GitHub release is published, and
# rehearses everything but the upload when run by hand (Actions -> Release -> Run
# workflow): a dry run builds, checks and installs, and uploads nothing.
#
# Order: gate -> build -> kernel -> assemble -> install -> publish -> verify.
# - gate: validate.yml already passed on this exact commit. The suite is not run
#   again; land on main, wait for its validation to pass, then publish the release.
#   A release published too early fails here and uploads nothing; re-run this
#   workflow once validation has passed.
# - build: the release tag must name the version every package declares
#   (tools/check_release_version.py), and the PyPI descriptions link to the tag.
# - kernel: meshloom's compiled wheels, one per platform (manylinux 2.17 x86_64 and
#   aarch64, macOS 11 x86_64 and arm64, Windows x64), built from the meshloom sdist with
#   the pinned Rust toolchain and maturin. assemble replaces the build job's local
#   meshloom wheel by them, checks every one and writes the release's SHA256SUMS.
# - install: the built wheels installed as a user would, third-party requirements
#   resolved from PyPI, on Linux, macOS and Windows with Python 3.12 and the newest
#   CPython the dependencies publish wheels for.
# - publish (release only): PyPI trusted publishing (OIDC); no token is stored.
#   Each of the nine PyPI projects lists this repository as a publisher: owner
#   fieldalgo, repository openphysics, workflow release.yml, environment pypi.
#   Dependencies are uploaded before the packages that require them, the
#   openphysics meta distribution last.
# - verify (release only): PyPI serves byte-identical files, and installing from
#   PyPI passes the same checks on the same platforms.
#
# Not a validation workflow: validate.yml never triggers it and it never triggers
# validation. Release runs are queued, never cancelled.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: validation passed on the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require a successful validate.yml run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh api "repos/$REPO/actions/workflows/validate.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')
          if [ "$passed" -gt 0 ]; then
            echo "validation passed on $SHA"
            exit 0
          fi
          latest=$(gh api "repos/$REPO/actions/workflows/validate.yml/runs?head_sha=$SHA&per_page=1" \
            --jq '.workflow_runs[0] | "\(.status) \(.conclusion // "-") \(.html_url)"')
          echo "::error::no successful validate.yml run on $SHA (latest: ${latest:-none}). If validation is still running, re-run this workflow after it passes; if it failed or was cancelled, fix it or start validation on this commit first."
          exit 1

  build:
    name: build and check the distributions
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      # Builds and checks meshloom's sdist and a local wheel; the kernel job builds the release wheels.
      - name: Install the Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rust-src --no-self-update
      - name: Install pinned build tools
        run: python -m pip install -r tools/requirements-py312-linux.txt
      - name: Check the release version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = release ]; then
            python tools/check_release_version.py --tag "$TAG"
          else
            python tools/check_release_version.py
          fi
          version=$(python -c 'import tomllib; print(tomllib.load(open("packages/openphysics/pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build sdists and wheels and check their contents
        env:
          # PyPI descriptions link to the released tag; a dry run links to its commit.
          OPENPHYSICS_DOCS_REF: ${{ github.event_name == 'release' && github.ref_name || github.sha }}
        run: python tools/check_distributions.py --build-only --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build
          path: dist/
          if-no-files-found: error

  kernel:
    name: meshloom wheel (${{ matrix.platform }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: manylinux_2_17_x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {platform: manylinux_2_17_aarch64, os: ubuntu-24.04, target: aarch64-unknown-linux-gnu}
          - {platform: macosx_11_0_x86_64, os: macos-15, target: x86_64-apple-darwin}
          - {platform: macosx_11_0_arm64, os: macos-15, target: aarch64-apple-darwin}
          - {platform: win_amd64, os: windows-2022, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      # Any CPython >= 3.12 builds the abi3 wheel. 3.12.10 is the last 3.12 with binaries for
      # macOS and Windows (later 3.12 releases are source-only), as in platform-install.yml.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build
          path: build
      - name: Unpack the meshloom sdist
        shell: bash
        run: |
          mkdir sdist
          tar -xzf build/meshloom-*.tar.gz -C sdist
          echo "SOURCE=$(ls -d sdist/meshloom-*)" >> "$GITHUB_ENV"
      # Pinned to the v1.51.0 commit. Builds in the manylinux2014 container on Linux.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --locked --out wheels
          target: ${{ matrix.target }}
          manylinux: "2014"
          working-directory: ${{ env.SOURCE }}
          maturin-version: "1.16.0"
          rust-toolchain: "1.97.0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-${{ matrix.platform }}
          path: ${{ env.SOURCE }}/wheels/*.whl
          if-no-files-found: error

  assemble:
    name: assemble and check the release files
    needs: [build, kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install pinned build tools
        run: python -m pip install -r tools/requirements-py312-linux.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kernel-*
          path: kernels
      - name: Replace the local meshloom wheel by the platform wheels and check them
        run: python tools/check_distributions.py --output dist --assemble kernels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  install:
    name: install (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        # 3.15: the newest CPython numpy, scipy, shapely and matplotlib publish wheels for
        # (checked 2026-10-21). Raise it when a newer CPython has them.
        python: ["3.12", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      # The checker picks the meshloom wheel this interpreter supports with packaging's tag
      # rules; packaging goes into the driver interpreter only, not into the venv it tests.
      - name: Install the checker's own requirement
        run: python -m pip install -c tools/requirements-py312-linux.txt packaging
      - name: Install the built wheels with requirements from PyPI and run the smoke check
        run: python -X utf8 tools/check_release_install.py --wheels dist --report release-install/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-install-${{ matrix.os }}-py${{ matrix.python }}
          path: release-install/
          if-no-files-found: warn

  publish:
    name: upload to PyPI
    needs: [build, assemble, install]
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/openphysics/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write          # trusted publishing: PyPI verifies this workflow's OIDC token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      - name: Check the files against the build's SHA256SUMS and split them by upload order
        run: |
          cd dist
          sha256sum --check --strict SHA256SUMS
          # 9 sdists, 8 pure wheels and 5 meshloom platform wheels.
          test "$(wc -l < SHA256SUMS)" -eq 22
          mkdir ../first ../second ../last
          # Packages without a requirement on another of ours.
          mv galerkin-* galerkin_refsol-* meshine-* meshloom-* gmshio-* physmat-* ../first/
          mv simcase-* sipi-* ../second/
          mv openphysics-* ../last/
          test -z "$(ls -A | grep -v '^SHA256SUMS$')"
          ls -l ../first ../second ../last
      # Pinned to the v1.14.2 commit, not to the annotated tag's object ID: the action runs a
      # container image named after the ref it is invoked with, and ghcr.io has an image for the
      # commit but none for the tag object ("manifest unknown").
      - name: Upload galerkin, galerkin-refsol, meshine, meshloom, gmshio and physmat
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: first/
          print-hash: true
      - name: Upload simcase and sipi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: second/
          print-hash: true
      - name: Upload the openphysics meta distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: last/
          print-hash: true

  verify:
    name: verify from PyPI (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [build, publish]
    if: ${{ github.event_name == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.12", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      - name: Compare PyPI's files with the build, install from PyPI and run the smoke check
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python -X utf8 tools/check_release_install.py --from-pypi "$VERSION" --sha256sums dist/SHA256SUMS --report release-verify/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-verify-${{ matrix.os }}-py${{ matrix.python }}
          path: release-verify/
          if-no-files-found: warn
