# Narrow installed thermal API/CLI and save ownership only.
name: Windows headless thermal save

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve main runs in one queue per workflow/ref; supersede older non-main runs.
  group: thermal-windows-${{ github.ref }}
  queue: ${{ github.ref == 'refs/heads/main' && 'max' || 'single' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows-py312-thermal:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Install pinned narrow validation environment
        run: |
          python -m pip install -r ci/requirements-py312-windows-thermal.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          exit $LASTEXITCODE
      - name: Build and install local headless wheels
        shell: python
        run: |
          import hashlib, json, os, pathlib, platform, shutil, subprocess, sys, venv
          root = pathlib.Path.cwd()
          output = root / '.validation-windows-thermal'
          output.mkdir()
          (output / 'environment.json').write_text(json.dumps({
              'platform': platform.platform(), 'python': sys.version,
              'sha': os.environ['GITHUB_SHA'], 'scope': 'installed headless thermal and selected save I/O; no Gmsh/full Windows support'
          }, indent=2))
          for package in ('galerkin', 'meshine', 'physmat', 'simcase'):
              subprocess.run([sys.executable, '-m', 'build', '--no-isolation', '--wheel',
                              '--outdir', str(output), str(root / 'packages' / package)], check=True)
          wheels = sorted(output.glob('*.whl'))
          assert len(wheels) == 4
          (output / 'SHA256SUMS').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in wheels))
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('thermal-installed-' + os.environ['GITHUB_RUN_ID'])
          work.mkdir()
          venv.EnvBuilder(system_site_packages=True, with_pip=True).create(work / 'venv')
          python = work / 'venv' / 'Scripts' / 'python.exe'
          subprocess.run([str(python), '-I', '-m', 'pip', 'install', '--no-index', '--no-deps',
                          *map(str, wheels)], check=True, cwd=work)
          subprocess.run([str(python), '-I', '-m', 'pip', 'check'], check=True, cwd=work)
          expected = {}
          for module, package, relative in (
              ('simcase', 'simcase', 'simcase/__init__.py'),
              ('simcase.schema', 'simcase', 'simcase/schema.py'),
              ('simcase.transient_thermal_contract', 'simcase', 'simcase/transient_thermal_contract.py'),
              ('simcase.transient_thermal', 'simcase', 'simcase/transient_thermal.py'),
              ('simcase.runner', 'simcase', 'simcase/runner.py'),
              ('simcase.cli', 'simcase', 'simcase/cli.py'),
              ('simcase.examples', 'simcase', 'simcase/examples.py'),
              ('simcase.thermal', 'simcase', 'simcase/thermal.py'),
              ('galerkin.transient_heat', 'galerkin', 'galerkin/transient_heat.py'),
          ):
              expected[module] = hashlib.sha256((root / 'packages' / package / relative).read_bytes()).hexdigest()
          probe = '\n'.join([
              'import hashlib, importlib, json, pathlib, sys',
              'expected = ' + repr(expected),
              'report = {}',
              'assert sys.flags.isolated',
              'for name, digest in expected.items():',
              '    path = pathlib.Path(importlib.import_module(name).__file__).resolve()',
              '    assert path.is_relative_to(pathlib.Path(sys.prefix).resolve()), name',
              '    actual = hashlib.sha256(path.read_bytes()).hexdigest()',
              '    assert actual == digest, name',
              '    report[name] = {"origin": str(path), "sha256": actual}',
              'pathlib.Path(sys.argv[1]).write_text(json.dumps(report, indent=2) + "\\n", encoding="utf-8")',
          ])
          subprocess.run([str(python), '-I', '-c', probe,
                          str(output / 'headless-module-origins.json')], check=True, cwd=work)
          tests = work / 'tests'
          tests.mkdir()
          shutil.copy2(root / 'ci' / 'test_thermal_simcase_wheel.py', tests)
          shutil.copy2(root / 'packages' / 'simcase' / 'tests' / 'test_thermal.py', tests / 'test_shipped_thermal_io.py')
          shutil.copy2(root / 'packages' / 'simcase' / 'tests' / 'test_transient_headless_windows.py', tests)
          examples = work / 'examples'
          examples.mkdir()
          for filename in ('thermal_slab.json', 'thermal_mixed.json'):
              shutil.copy2(root / 'packages' / 'simcase' / 'examples' / filename, examples)
          (output / 'consumer-work.json').write_text(json.dumps({'work': str(work), 'python': str(python)}))
      - name: Installed headless API CLI and selected save behavior
        shell: python
        run: |
          import json, pathlib, subprocess
          root = pathlib.Path.cwd()
          output = root / '.validation-windows-thermal'
          context = json.loads((output / 'consumer-work.json').read_text())
          work = pathlib.Path(context['work'])
          selection = ('not test_shipped_thermal_io or partial_failure_safe_cleanup or '
                       'simultaneous_writers_preserve_winner or existing_target_unchanged or '
                       'fields_disabled_cli_and_expected_errors or cli_nonfinite_summary_exit1')
          with (output / 'windows-installed.log').open('w') as log:
              result = subprocess.run([context['python'], '-I', '-m', 'pytest', '-q', '-ra',
                  '--confcutdir', str(work / 'tests'), '-k', selection,
                  '--junitxml=' + str(output / 'windows-installed-tests.xml'), str(work / 'tests')],
                  cwd=work, stdout=log, stderr=subprocess.STDOUT, text=True)
          print((output / 'windows-installed.log').read_text())
          raise SystemExit(result.returncode)
      - name: Source target-protection fixture from the same consumer file
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import json, pathlib, subprocess
          root = pathlib.Path.cwd()
          output = root / '.validation-windows-thermal'
          context = json.loads((output / 'consumer-work.json').read_text())
          # Root conftest selects this exact checkout for API imports; CLI stays
          # isolated and consumes the wheels built from the same checkout.
          with (output / 'windows-source-target.log').open('w') as log:
              result = subprocess.run([context['python'], '-I', '-m', 'pytest', '-q', '-ra',
                  '--confcutdir', str(root), '-k', 'api_and_cli_preserve_existing_target',
                  '--junitxml=' + str(output / 'windows-source-target-tests.xml'),
                  str(root / 'ci' / 'test_thermal_simcase_wheel.py')],
                  cwd=root, stdout=log, stderr=subprocess.STDOUT, text=True)
          print((output / 'windows-source-target.log').read_text())
          raise SystemExit(result.returncode)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-thermal-installed-and-io-${{ github.run_id }}
          path: .validation-windows-thermal/
          include-hidden-files: true
          if-no-files-found: error
