name: Validate packages

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux-py312:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Install Gmsh system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxinerama1
      - name: Install pinned validation environment
        run: |
          python -m pip install -r ci/requirements-py312-linux.txt
          python -m pip install --no-deps --no-build-isolation \
            -e packages/galerkin -e packages/galerkin-refsol -e packages/meshine \
            -e packages/gmshio -e packages/physmat -e packages/simcase
          python -m pip check
          gmsh --version
      - name: Fetch pinned RII database
        run: python ci/fetch_rii.py "$RUNNER_TEMP/rii"
      - name: Check steady boundary contract before transient and full acceptance
        run: |
          python -m pytest -q -ra --showlocals --junitxml=.validation/steady-boundary-preflight.xml \
            packages/simcase/tests/test_steady_boundary_contract.py
      - name: Check transient document acceptance before the full suite
        run: |
          python ci/tools/diagnose_transient_conditioning.py --report .validation/transient-conditioning.json
          python -m pytest -q -ra --showlocals --junitxml=.validation/transient-preflight.xml \
            packages/galerkin/tests/test_transient_heat_tiny_domain.py \
            packages/galerkin/tests/test_transient_heat_general_state.py \
            packages/simcase/tests/test_transient_headless_independent_validation.py \
            packages/simcase/tests/test_transient_thermal_runtime.py \
            packages/simcase/tests/test_transient_thermal_contract.py \
            packages/simcase/tests/test_transient_headless_windows.py \
            packages/simcase/tests/test_studio_transient.py
      - name: Run all Python tests including RII and convergence studies
        id: source_tests
        env:
          PHYSMAT_RII_PATH: ${{ runner.temp }}/rii/database
        run: python -m pytest -q -ra --junitxml=.validation/source-tests.xml
      - name: Build sdists and validate installed wheels
        # Preserve a failing source gate while collecting independent package evidence.
        if: ${{ !cancelled() && (steps.source_tests.outcome == 'success' || steps.source_tests.outcome == 'failure') }}
        run: |
          python ci/check_distributions.py
          python ci/tools/audit_distribution_artifacts.py --artifacts .validation/dist --report .validation/distribution-audit.json
      - name: Check Studio vector rendering
        if: ${{ !cancelled() && (steps.source_tests.outcome == 'success' || steps.source_tests.outcome == 'failure') }}
        run: node --test packages/simcase/tests/studio_vector.cjs packages/simcase/tests/studio_thermal.cjs packages/simcase/tests/thermal_simcase_independent_stale.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: distributions-and-test-results
          path: .validation/
          include-hidden-files: true
          if-no-files-found: warn

  tests:
    name: tests
    needs: linux-py312
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete Linux validation
        env:
          VALIDATION_RESULT: ${{ needs.linux-py312.result }}
        run: test "$VALIDATION_RESULT" = success
