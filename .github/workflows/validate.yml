name: Validate packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  queue: ${{ github.ref == 'refs/heads/main' && 'max' || 'single' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux-py312:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # Usually 16-22 min; a slow hosted runner took 30+ min on 2026-10-19 and was
    # cancelled. The limit only stops hung jobs, so keep about twice the norm.
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Install Gmsh system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxinerama1
      - name: Install pinned validation environment
        run: |
          python -m pip install -r tools/requirements-py312-linux.txt
          # Optional array libraries for galerkin[jax] and galerkin[torch]; torch is
          # the CPU build (the PyPI Linux wheel pulls CUDA packages).
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu
          python -m pip install -r tools/requirements-py312-linux-backends.txt
          python -m pip install --no-deps --no-build-isolation \
            -e packages/galerkin -e packages/galerkin-refsol -e packages/meshine \
            -e packages/gmshio -e packages/physmat -e packages/simcase -e packages/sipi
          python -m pip check
          gmsh --version
      # The backend tests skip when a library is absent; here an absent one must
      # fail the job instead of turning those tests into silent skips.
      - name: Verify the optional array libraries import
        run: python -c "import array_api_compat, jax, torch; print(jax.__version__, torch.__version__)"
      - name: Check installed licenses against the reviewed inventory
        run: |
          mkdir -p .validation
          python tools/check_licenses.py --report .validation/licenses-validation-env.json
      - name: Check that the eight distributions share one release version
        run: python tools/check_release_version.py
      - name: Check Markdown links
        run: |
          python -m pytest -q -ra tools/tests/test_markdown_links.py tools/tests/test_readme_links.py
          python tools/check_markdown_links.py
      - name: Record CPU model and BLAS kernel
        run: |
          mkdir -p .validation
          python tools/report_numeric_runtime.py --json .validation/numeric-runtime.json
      - name: Fetch pinned RII database
        run: python tools/fetch_rii.py "$RUNNER_TEMP/rii"
      - name: Check steady boundary contract before transient and full acceptance
        run: |
          python -m pytest -q -ra --showlocals --junitxml=.validation/steady-boundary-preflight.xml \
            tests/simcase/test_thermal.py \
            tests/simcase/test_thermal_simcase_independent_validation.py \
            tests/simcase/test_steady_boundary_contract.py \
            tests/simcase/test_steady_boundary_independent_validation.py \
            tests/simcase/test_steady_boundary_schema.py \
            tests/simcase/test_steady_boundary_runtime.py \
            tests/simcase/test_steady_boundary_platform.py \
            tests/simcase/test_studio_steady_boundary.py
      - name: Check transient document acceptance before the full suite
        run: |
          python tools/diagnose_transient_conditioning.py --report .validation/transient-conditioning.json
          python -m pytest -q -ra --showlocals --junitxml=.validation/transient-preflight.xml \
            tests/galerkin/test_transient_heat_tiny_domain.py \
            tests/galerkin/test_transient_heat_general_state.py \
            tests/simcase/test_transient_headless_independent_validation.py \
            tests/simcase/test_transient_thermal_runtime.py \
            tests/simcase/test_transient_thermal_contract.py \
            tests/simcase/test_transient_headless_windows.py \
            tests/simcase/test_studio_transient.py
      - name: Check steady thermal Studio before the full suite
        run: |
          python -m pytest -q -ra --junitxml=.validation/studio-thermal-preflight.xml \
            tests/simcase/test_studio_steady_thermal_http.py \
            tests/simcase/test_studio_thermal_acceptance.py \
            tests/simcase/test_studio_thermal_lifecycle.py \
            tests/simcase/test_studio_rectangle_invariants.py
      - name: Check transient thermomechanical contract and separated convergence
        run: |
          python -m pytest -q --capture=tee-sys -o junit_logging=all --junitxml=.validation/transient-thermomechanical.xml \
            tests/galerkin/test_transient_thermal_mechanical.py \
            tests/galerkin/test_transient_thermal_mechanical_physics.py
      - name: Check transient thermal Studio before the full suite
        run: |
          python -m pytest -q -ra -o junit_logging=all -o junit_log_passing_tests=true --junitxml=.validation/studio-transient-preflight.xml \
            tests/simcase/test_studio_transient_server_http.py \
            tests/simcase/test_studio_transient_thermal_acceptance.py \
            tests/simcase/test_studio_transient_lifecycle.py
      - name: Run all Python tests including RII and convergence studies
        id: source_tests
        env:
          PHYSMAT_RII_PATH: ${{ runner.temp }}/rii/database
          # Reference-tool comparisons must run, not skip, and keep their records.
          OPENPHYSICS_REQUIRE_CROSSCHECK: "1"
          OPENPHYSICS_CROSSCHECK_DIR: .validation/crosscheck
        run: python -m pytest -q -ra --junitxml=.validation/source-tests.xml
      - name: Build sdists and validate installed wheels
        # Preserve a failing source gate while collecting independent package evidence.
        if: ${{ !cancelled() && (steps.source_tests.outcome == 'success' || steps.source_tests.outcome == 'failure') }}
        run: |
          python tools/check_distributions.py
          python tools/audit_distribution_artifacts.py --artifacts .validation/dist --report .validation/distribution-audit.json
      - name: Check all Studio JavaScript contracts
        if: ${{ !cancelled() && (steps.source_tests.outcome == 'success' || steps.source_tests.outcome == 'failure') }}
        run: node --test tests/simcase/*.cjs
      - name: Observe exact steady thermal Studio resources once
        if: ${{ success() }}
        run: python tools/studio_resources/profile_studio_thermal.py --source-root "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --output .validation/studio-resource-observation
      - name: Observe exact transient thermal Studio resources once
        if: ${{ success() }}
        run: python tools/studio_resources/run_transient_resource_workloads.py --source-root "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --output .validation/transient-resource-observation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: distributions-and-test-results
          path: .validation/
          include-hidden-files: true
          if-no-files-found: warn

  installed-tests:
    # The whole tests/ folder against wheels built from the sdists and installed
    # outside the checkout. No test is selected by name.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # About 25 min in a local Linux run (build, install, full suite); the limit only
    # stops hung jobs.
    timeout-minutes: 50
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install Gmsh system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxinerama1
      - name: Install pinned build and validation tools
        run: python -m pip install -r tools/requirements-py312-linux.txt
      - name: Record CPU model and BLAS kernel
        run: |
          mkdir -p .validation
          python tools/report_numeric_runtime.py --json .validation/installed-numeric-runtime.json
      - name: Fetch pinned RII database
        run: python tools/fetch_rii.py "$RUNNER_TEMP/rii"
      - name: Run every test against the installed wheels
        env:
          PHYSMAT_RII_PATH: ${{ runner.temp }}/rii/database
          OPENPHYSICS_REQUIRE_CROSSCHECK: "1"
          OPENPHYSICS_CROSSCHECK_DIR: .validation/installed-crosscheck
        run: python tools/run_installed_tests.py --output .validation/installed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installed-test-results
          path: .validation/
          include-hidden-files: true
          if-no-files-found: warn

  blas-kernels:
    # Hosted runners change CPU model between runs, and OpenBLAS picks its kernel
    # from the CPU, so last-bit results can differ for the same commit. Force two
    # kernels that round differently (Haswell: AVX2, also used on AMD Zen;
    # Sandybridge: AVX) so numerically sensitive tests cannot depend on whichever
    # runner the job happened to get.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        core: [Haswell, Sandybridge]
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: ${{ matrix.core }}
      # OpenBLAS 0.3.34 enlarges GEMM blocking on AVX-512 AMD hosts (Zen 4/5)
      # even when the core type is forced, which overflows a stack buffer in
      # the Haswell DGEMM kernel and crashes (OpenMathLib/OpenBLAS#6021).
      # An L2 size other than 1024 KB turns that override off, so the forced
      # kernel runs with its own blocking, as on a real Haswell or Sandybridge
      # CPU. Remove this once the pinned numpy bundles an OpenBLAS with the
      # fix (OpenMathLib/OpenBLAS#6027, planned for 0.3.35); see #78.
      OPENBLAS_L2_SIZE: "2048"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install pinned validation environment
        run: |
          python -m pip install -r tools/requirements-py312-linux.txt
          python -m pip install --no-deps --no-build-isolation \
            -e packages/galerkin -e packages/galerkin-refsol -e packages/meshine \
            -e packages/gmshio -e packages/physmat -e packages/simcase -e packages/sipi
      - name: Confirm the forced OpenBLAS kernel and record the CPU
        run: python tools/report_numeric_runtime.py --expect-core "${{ matrix.core }}"
      - name: Numerically sensitive tracking, eigenspace, cavity and fiber reference tests
        run: |
          python -m pytest -q -ra -m "not slow" \
            tests/simcase/test_tracking.py \
            tests/simcase/test_subspace_tracking.py \
            tests/simcase/test_subspace_sweep.py \
            tests/simcase/test_vector_sweep.py \
            tests/simcase/test_length_canonical.py \
            tests/simcase/test_thermal_length_canonical.py \
            tests/galerkin/test_eigenspace_reliability.py \
            tests/galerkin/test_material_cavity.py \
            tests/galerkin/test_cavity_wall_loss.py \
            tests/refsol/test_fiber_group_index.py \
            tests/refsol/test_fiber_fields.py

  installed-platforms:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/platform-install.yml

  tests:
    name: tests
    needs: [linux-py312, installed-tests, blas-kernels, installed-platforms]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete Linux and installed-platform validation
        env:
          VALIDATION_RESULT: ${{ needs.linux-py312.result }}
          INSTALLED_RESULT: ${{ needs.installed-tests.result }}
          KERNEL_RESULT: ${{ needs.blas-kernels.result }}
          PLATFORM_RESULT: ${{ needs.installed-platforms.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$INSTALLED_RESULT" = success
          test "$KERNEL_RESULT" = success
          test "$PLATFORM_RESULT" = success
