name: CI queue smoke
run-name: Queue smoke ${{ inputs.mode }} ${{ inputs.sequence }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [main, pr]
        required: true
      sequence:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: queue-smoke-${{ github.ref }}-${{ inputs.mode }}
  queue: ${{ inputs.mode == 'main' && 'max' || 'single' }}
  cancel-in-progress: ${{ inputs.mode != 'main' }}
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Hold the isolated test group briefly
        run: |
          date -u +%FT%TZ
          sleep 45
          date -u +%FT%TZ
