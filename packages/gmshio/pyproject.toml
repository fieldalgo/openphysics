[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmshio"
version = "0.1.0"
description = "Run Gmsh as an external process and read MSH 4.1 meshes into numpy arrays for FEM codes"
dynamic = ["readme"]  # README.md with absolute links, built by setup.py
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Yongha Kim" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/FieldAlgo/openphysics/tree/main/packages/gmshio"
Repository = "https://github.com/FieldAlgo/openphysics/tree/main/packages/gmshio"
Issues = "https://github.com/FieldAlgo/openphysics/issues"

[project.optional-dependencies]
test = ["pytest"]
gmsh = ["gmsh"]
plot = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["gmshio*"]
