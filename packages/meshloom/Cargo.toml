[package]
name = "meshloom-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Compiled kernel of the meshloom tetrahedral mesher"
readme = "README.md"

[lib]
name = "_kernel"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", default-features = false, features = ["macros", "extension-module", "abi3-py312"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
