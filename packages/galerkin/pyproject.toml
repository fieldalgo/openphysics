[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "galerkin"
version = "0.1.0"
description = "A finite-element engine for electromagnetics, built milestone by milestone against analytical solutions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Yongha Kim" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/FieldAlgo/galerkin"
Repository = "https://github.com/FieldAlgo/galerkin"
Issues = "https://github.com/FieldAlgo/galerkin/issues"

[project.optional-dependencies]
# The answer key lives in its own package so the engine never imports what grades
# it. tests/test_independence.py enforces that separation.
test = [
    "pytest",
    "galerkin-refsol @ git+https://github.com/FieldAlgo/galerkin-refsol",
    # meshers, exercised through galerkin.from_mesher. Neither is a runtime
    # dependency; gmshio additionally wants a `gmsh` executable on PATH
    # (pip install gmsh), which it runs as a separate process and never links.
    "meshine @ git+https://github.com/FieldAlgo/meshine",
    "gmshio @ git+https://github.com/FieldAlgo/gmshio",
]
figures = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["galerkin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: convergence studies that take more than a few seconds"]
