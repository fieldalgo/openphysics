[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "galerkin"
version = "0.1.0"
description = "Pure-Python finite-element engine for electromagnetics, heat conduction and elasticity, validated against analytical solutions"
dynamic = ["readme"]  # README.md with absolute links, built by setup.py
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yongha Kim" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.26", "scipy>=1.11.2"]

[project.urls]
Homepage = "https://github.com/fieldalgo/openphysics/tree/main/packages/galerkin"
Repository = "https://github.com/fieldalgo/openphysics/tree/main/packages/galerkin"
Issues = "https://github.com/fieldalgo/openphysics/issues"

[project.optional-dependencies]
# The answer key lives in its own package so the engine never imports what grades
# it. tests/galerkin/test_independence.py enforces that separation.
test = [
    "pytest",
    "galerkin-refsol>=0.1.0,<0.2",
    # meshers, exercised through galerkin.from_mesher. Neither is a runtime
    # dependency; gmshio additionally wants a `gmsh` executable on PATH
    # (pip install gmsh), which it runs as a separate process and never links.
    "meshine>=0.1.0,<0.2",
    "gmshio>=0.1.0,<0.2",
]
figures = ["matplotlib>=3.8"]
# Reference tools for code-to-code comparisons (tests/galerkin/test_crosscheck_*.py), test only.
# Permissive licenses only, by choice; weak-copyleft or GPL reference tools run
# separately and are never installed here. See docs/third-party.md in the repository.
# symfem (with sympy) supplies exact element definitions; the engine never imports it.
crosscheck = ["scikit-fem>=12,<13", "symfem==2025.12.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["galerkin*"]
