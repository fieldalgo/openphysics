<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenPhysics studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f4f5f7; --panel:#ffffff; --line:#d9dce1; --ink:#1f2328; --muted:#6b7280; --accent:#2f6fed; --accent2:#0b7a5a; --warn:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--ink); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  header .brand { font-weight:700; letter-spacing:.3px; margin-right:12px; }
  header .brand small { color:var(--muted); font-weight:400; margin-left:6px; }
  button, select, input[type=file] { font: inherit; }
  button { padding:5px 10px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
  button:hover { border-color:#b9bec7; background:#fafbfc; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary:hover { background:#265fd0; }
  button.run { background:var(--accent2); color:#fff; border-color:var(--accent2); }
  button.danger { color:var(--warn); }
  button:disabled { opacity:.5; cursor:default; }
  select, input[type=text], input[type=number] { padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:#fff; width:100%; }
  header select { width:auto; min-width:160px; }
  #status { margin-left:auto; color:var(--muted); }
  main { flex:1; display:grid; grid-template-columns: 250px 1fr 300px; min-height:0; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; }
  aside.right { border-right:0; border-left:1px solid var(--line); }
  .tree { padding:8px 0; }
  .tree .node { padding:4px 10px; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .tree .node:hover { background:#f0f3f8; }
  .tree .node.sel { background:#e6eefc; color:var(--accent); font-weight:600; }
  .tree .node.lvl1 { padding-left:24px; }
  .tree .node.lvl2 { padding-left:38px; }
  .tree .node .ic { width:14px; color:var(--muted); font-size:11px; }
  .tree .add { padding:2px 38px; }
  .tree .add button { font-size:12px; padding:2px 8px; }
  section.center { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .tabs { display:flex; gap:2px; padding:6px 10px 0; background:var(--panel); border-bottom:1px solid var(--line); }
  .tabs button { border-radius:6px 6px 0 0; border-bottom:none; background:#eef0f3; }
  .tabs button.on { background:#fff; font-weight:600; }
  .view { flex:1; position:relative; min-height:0; background:#fff; }
  .view > div { position:absolute; inset:0; display:none; flex-direction:column; }
  .view > div.on { display:flex; }
  .toolbar { display:flex; gap:8px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); color:var(--muted); flex-wrap:wrap; }
  .toolbar label { display:flex; align-items:center; gap:4px; }
  .toolbar label[hidden] { display:none; }
  .toolbar select, .toolbar input { width:auto; }
  canvas.plot { flex:1; width:100%; height:100%; display:block; background:#fff; }
  .legend { position:absolute; right:12px; top:44px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:12px; }
  .legend div { display:flex; align-items:center; gap:6px; }
  .legend i { width:12px; height:12px; display:inline-block; border-radius:2px; border:1px solid rgba(0,0,0,.2); }
  #json { flex:1; width:100%; border:0; padding:10px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; resize:none; }
  .props { padding:10px 12px; }
  .props h3 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
  .props .row { display:grid; grid-template-columns: 96px 1fr; gap:6px; align-items:center; margin:5px 0; }
  .props .row label { color:var(--muted); }
  .props .hint { color:var(--muted); font-size:12px; margin:8px 0; }
  .props .actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  footer { height:150px; display:flex; flex-direction:column; border-top:1px solid var(--line); background:var(--panel); }
  footer .bar { padding:3px 10px; color:var(--muted); border-bottom:1px solid var(--line); display:flex; gap:12px; }
  #log { flex:1; margin:0; padding:6px 10px; overflow:auto; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; white-space:pre-wrap; }
  #log .err { color:var(--warn); }
  table.res { border-collapse:collapse; margin:8px 10px; font-size:12px; }
  table.res th, table.res td { border:1px solid var(--line); padding:3px 8px; text-align:right; }
  table.res th { background:#f3f4f6; }
  .results-body { flex:1; display:grid; grid-template-columns: 1fr 340px; min-height:0; }
  .results-body .side { overflow:auto; border-left:1px solid var(--line); }
  .results-body .side table { font-size:11px; }
  .result-table-scroll { max-width:100%; overflow-x:auto; margin-bottom:8px; }
  .split { display:flex; flex-direction:column; min-height:0; }
</style>
</head>
<body>
<header>
  <span class="brand">OpenPhysics studio<small>model editor for OpenPhysics</small></span>
  <select id="exampleSel"></select>
  <button id="loadExample">Load example</button>
  <button id="openFile">Open…</button><input type="file" id="fileInput" accept=".json" hidden>
  <button id="download">Download JSON</button>
  <button id="validate">Validate</button>
  <button id="meshBtn" class="primary">Generate mesh</button>
  <button id="runBtn" class="run">Run</button>
  <span id="status">ready</span>
</header>
<main>
  <aside><div class="tree" id="tree"></div></aside>
  <section class="center">
    <div class="tabs">
      <button data-tab="geometry" class="on">Geometry</button>
      <button data-tab="mesh">Mesh</button>
      <button data-tab="results">Results</button>
      <button data-tab="json">JSON</button>
    </div>
    <div class="view">
      <div id="tab-geometry" class="on">
        <div class="toolbar"><span id="geoInfo">domain</span></div>
        <canvas id="geoCanvas" class="plot"></canvas>
        <div class="legend" id="geoLegend"></div>
      </div>
      <div id="tab-mesh">
        <div class="toolbar"><span id="meshInfo">no mesh yet — press Generate mesh</span></div>
        <canvas id="meshCanvas" class="plot"></canvas>
        <div class="legend" id="meshLegend"></div>
      </div>
      <div id="tab-results">
        <div class="toolbar">
          <label>point <select id="ptSel"></select></label>
          <label>mode <select id="modeSel"></select></label>
          <label id="componentLabel" hidden>field <select id="componentSel">
            <option value="magnitude">|E|</option><option value="0">|Ex|</option>
            <option value="1">|Ey|</option><option value="2">|Ez|</option>
          </select></label>
          <span id="resInfo">no results yet — press Run</span>
        </div>
        <div class="results-body">
          <div class="split"><canvas id="fieldCanvas" class="plot"></canvas></div>
          <div class="side"><canvas id="sweepCanvas" width="340" height="240"></canvas><div id="resTable"></div></div>
        </div>
      </div>
      <div id="tab-json">
        <div class="toolbar"><button id="applyJson">Apply JSON</button><span id="jsonInfo">edit the document directly; Apply validates and reloads the tree</span></div>
        <textarea id="json" spellcheck="false"></textarea>
      </div>
    </div>
  </section>
  <aside class="right"><div class="props" id="props"></div></aside>
</main>
<footer>
  <div class="bar"><span>log</span><span id="jobInfo"></span></div>
  <pre id="log"></pre>
</footer>

<script>
'use strict';
// ------------------------------------------------------------------ state
let doc = null;            // the OpenPhysics document (plain object)
let selected = 'model';    // tree node id
let materials = [];        // physmat built-ins from the server
let meshData = null, resultData = null, currentJob = null;
let documentRevision = 0;
const $ = id => document.getElementById(id);

function isHeadlessThermalType(type) {
  return type === 'thermal.steady2d' || type === 'thermal.transient2d';
}
function isHeadlessThermal(data = doc) {
  return Object.values(data?.physics || {}).some(p => isHeadlessThermalType(p?.type));
}
function clearResultViews() {
  meshData = resultData = null; currentJob = null;
  $('ptSel').innerHTML = $('modeSel').innerHTML = '';
  $('componentLabel').hidden = true; $('jobInfo').textContent = '';
  fillResultTable(); drawField(); drawSweep();
  const cv = $('meshCanvas'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
}
function invalidateDocument() {
  documentRevision += 1; clearResultViews();
  $('runBtn').disabled = $('meshBtn').disabled = isHeadlessThermal();
  return documentRevision;
}

const api = {
  async get(url) { const r = await fetch(url); if (!r.ok) throw new Error(await errText(r)); return r.json(); },
  async post(url, body) { const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) throw new Error(await errText(r)); return r.json(); },
};
async function errText(r) { try { const j = await r.json(); return j.detail || JSON.stringify(j); } catch { return r.statusText; } }

function log(msg, cls) { const el = document.createElement('div'); if (cls) el.className = cls; el.textContent = msg; $('log').appendChild(el); $('log').scrollTop = 1e9; }
function status(s) { $('status').textContent = s; }
function lengthUnit(units = doc?.units) {
  const length = units?.length;
  if (typeof length === 'string') return length;
  if (length && typeof length.in_m === 'number') return `${length.in_m} m`;
  return 'undeclared';
}
function studyLabel(data) {
  const path = data.parameter;
  return (path || 'λ') + (!path || path.endsWith('.wavelength') ? ` (${lengthUnit(data.summary.units)})` : '');
}

// ------------------------------------------------------------------ colours
function hashColor(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; const hue = h % 360; return `hsl(${hue} 55% 62%)`; }
const INFERNO = [[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[250,193,39],[252,255,164]];
function cmap(t) { t = Math.min(1, Math.max(0, t)); const x = t * (INFERNO.length - 1), i = Math.min(INFERNO.length - 2, Math.floor(x)), f = x - i;
  const a = INFERNO[i], b = INFERNO[i + 1]; return `rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`; }

// ------------------------------------------------------------------ canvas helpers
function fitCanvas(cv) { const r = cv.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return [ctx, r.width, r.height]; }
function transformFor(dom, W, H, margin = 30) {
  const sx = (W - 2 * margin) / (dom.xmax - dom.xmin), sy = (H - 2 * margin) / (dom.ymax - dom.ymin), s = Math.min(sx, sy);
  const cx = (dom.xmin + dom.xmax) / 2, cy = (dom.ymin + dom.ymax) / 2;
  return { s, X: x => W / 2 + (x - cx) * s, Y: y => H / 2 - (y - cy) * s };
}
function drawAxes(ctx, T, dom, W, H, unit = lengthUnit()) {
  ctx.strokeStyle = '#9aa1ab'; ctx.lineWidth = 1; ctx.strokeRect(T.X(dom.xmin), T.Y(dom.ymax), (dom.xmax - dom.xmin) * T.s, (dom.ymax - dom.ymin) * T.s);
  ctx.fillStyle = '#6b7280'; ctx.font = '11px system-ui';
  ctx.textAlign = 'center'; ctx.fillText(`x: ${dom.xmin} … ${dom.xmax} ${unit}`, W / 2, H - 8);
  ctx.save(); ctx.translate(12, H / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(`y: ${dom.ymin} … ${dom.ymax} ${unit}`, 0, 0); ctx.restore();
}

// ------------------------------------------------------------------ geometry view
function shapePath(ctx, s, T) {
  ctx.beginPath();
  if (s.type === 'rect') ctx.rect(T.X(s.x), T.Y(s.y + s.h), s.w * T.s, s.h * T.s);
  else if (s.type === 'circle') ctx.arc(T.X(s.cx), T.Y(s.cy), s.r * T.s, 0, 2 * Math.PI);
  else if (s.type === 'polygon') { s.points.forEach((p, i) => i ? ctx.lineTo(T.X(p[0]), T.Y(p[1])) : ctx.moveTo(T.X(p[0]), T.Y(p[1]))); ctx.closePath(); }
}
function drawGeometry() {
  if (!doc) return;
  const cv = $('geoCanvas'); const [ctx, W, H] = fitCanvas(cv); ctx.clearRect(0, 0, W, H);
  const dom = doc.geometry.domain; const T = transformFor(dom, W, H);
  ctx.fillStyle = hashColor(doc.geometry.background.material); ctx.globalAlpha = .35;
  ctx.fillRect(T.X(dom.xmin), T.Y(dom.ymax), (dom.xmax - dom.xmin) * T.s, (dom.ymax - dom.ymin) * T.s); ctx.globalAlpha = 1;
  ctx.save(); ctx.beginPath(); ctx.rect(T.X(dom.xmin), T.Y(dom.ymax), (dom.xmax - dom.xmin) * T.s, (dom.ymax - dom.ymin) * T.s); ctx.clip();
  doc.geometry.shapes.forEach((s, i) => {
    shapePath(ctx, s, T); ctx.fillStyle = hashColor(s.material); ctx.globalAlpha = .75; ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = selected === `shape:${i}` ? 2.5 : 1; ctx.strokeStyle = selected === `shape:${i}` ? '#2f6fed' : '#334155'; ctx.stroke();
  });
  ctx.restore(); drawAxes(ctx, T, dom, W, H);
  ctx.fillStyle = '#1f2328'; ctx.font = '11px system-ui'; ctx.textAlign = 'left';
  doc.geometry.shapes.forEach(s => { const c = shapeCenter(s); ctx.fillText(s.name, T.X(c[0]) + 4, T.Y(c[1]) - 4); });
  const mats = [...new Set([doc.geometry.background.material, ...doc.geometry.shapes.map(s => s.material)])];
  $('geoLegend').innerHTML = mats.map(m => `<div><i style="background:${hashColor(m)}"></i>${m}</div>`).join('');
  $('geoInfo').textContent = `${doc.geometry.shapes.length} shape(s) on ${doc.geometry.background.material} background`;
}
function shapeCenter(s) { if (s.type === 'rect') return [s.x + s.w / 2, s.y + s.h / 2]; if (s.type === 'circle') return [s.cx, s.cy];
  const n = s.points.length; return [s.points.reduce((a, p) => a + p[0], 0) / n, s.points.reduce((a, p) => a + p[1], 0) / n]; }

// ------------------------------------------------------------------ mesh view
function drawTriangles(ctx, T, nodes, tris, colorOf, edges = true) {
  for (let t = 0; t < tris.length; t++) {
    const [a, b, c] = tris[t];
    ctx.beginPath(); ctx.moveTo(T.X(nodes[a][0]), T.Y(nodes[a][1])); ctx.lineTo(T.X(nodes[b][0]), T.Y(nodes[b][1])); ctx.lineTo(T.X(nodes[c][0]), T.Y(nodes[c][1])); ctx.closePath();
    const col = colorOf(t); ctx.fillStyle = col; ctx.fill();
    if (edges) { ctx.strokeStyle = 'rgba(30,41,59,.7)'; ctx.lineWidth = .6; ctx.stroke(); }
    else { ctx.strokeStyle = col; ctx.lineWidth = .7; ctx.stroke(); }   // hide anti-aliasing seams
  }
}
function drawMesh() {
  const cv = $('meshCanvas'); const [ctx, W, H] = fitCanvas(cv); ctx.clearRect(0, 0, W, H);
  if (!meshData || !doc) return;
  const dom = doc.geometry.domain; const T = transformFor(dom, W, H);
  const cols = meshData.region_names.map(n => hashColor(meshData.region_materials[n] || n));
  drawTriangles(ctx, T, meshData.nodes, meshData.triangles, t => cols[meshData.regions[t]], meshData.triangles.length < 40000);
  drawAxes(ctx, T, dom, W, H, lengthUnit(meshData.units));
  $('meshLegend').innerHTML = meshData.region_names.map((n, i) => `<div><i style="background:${cols[i]}"></i>${n} (${meshData.region_materials[n]})</div>`).join('');
  const s = meshData.stats; $('meshInfo').textContent = `${s.nodes} nodes, ${s.triangles} triangles, min angle ${s.min_angle}°, mean quality ${s.quality_mean}`;
}

// ------------------------------------------------------------------ results view
function vectorMagnitudes(field, mode, component) {
  const re = field.real[mode], im = field.imag[mode];
  return re.map((v, t) => component === 'magnitude'
    ? Math.hypot(...v, ...im[t]) : Math.hypot(v[+component], im[t][+component]));
}
function drawField() {
  const cv = $('fieldCanvas'); const [ctx, W, H] = fitCanvas(cv); ctx.clearRect(0, 0, W, H);
  if (!resultData || !doc) return;
  const p = +$('ptSel').value || 0, m = +$('modeSel').value || 0;
  const vector = resultData.vector_fields?.[p], component = $('componentSel').value || 'magnitude';
  const f = vector ? vectorMagnitudes(vector, m, component) : resultData.fields[p][m];
  const dom = doc.geometry.domain; const T = transformFor(dom, W, H);
  // Vector components share the mode's |E| scale, so a small Ez stays small.
  const scaleValues = vector ? vectorMagnitudes(vector, m, 'magnitude') : f;
  let vmax = 0; for (const v of scaleValues) vmax = Math.max(vmax, Math.abs(v)); vmax = vmax || 1;
  const nodes = resultData.nodes, tris = resultData.triangles;
  drawTriangles(ctx, T, nodes, tris, t => { if (vector) return cmap(f[t] / vmax);
    const [a, b, c] = tris[t]; return cmap((Math.abs(f[a]) + Math.abs(f[b]) + Math.abs(f[c])) / (3 * vmax)); }, false);
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1; doc.geometry.shapes.forEach(s => { shapePath(ctx, s, T); ctx.stroke(); }); ctx.restore();
  drawAxes(ctx, T, dom, W, H, lengthUnit(resultData.summary.units));
  const lab = `${studyLabel(resultData)} = ${resultData.values[p]}`;
  const fieldLabel = vector ? (component === 'magnitude' ? '|E|' : ['|Ex|', '|Ey|', '|Ez|'][+component]) : '|field|';
  const tracking = resultData.summary.mode_tracking, point = tracking?.points[p];
  const identity = tracking ? `tracked branch ${m + 1}` : `mode ${m + 1}`;
  const match = point ? (point.overlaps === null ? ', seed point' : `, overlap ${point.overlaps[m].toFixed(3)}`) : '';
  $('resInfo').textContent = `${fieldLabel}, ${identity} at ${lab}: n_eff = ${resultData.neff[p][m].toFixed(6)}${match}` +
    (vector ? ' (relative amplitude, common |E| scale)' : '');
}
function drawSweep() {
  const cv = $('sweepCanvas'); const ctx = cv.getContext('2d'); const W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
  if (!resultData) return;
  const xs = resultData.values, ys = resultData.neff; const nm = ys[0].length;
  if (xs.length < 2) { ctx.fillStyle = '#6b7280'; ctx.font = '12px system-ui'; ctx.fillText('single study point — see table', 20, 30); return; }
  const m = { l: 50, r: 16, t: 20, b: 34 };
  let ymin = Infinity, ymax = -Infinity; ys.forEach(r => r.forEach(v => { ymin = Math.min(ymin, v); ymax = Math.max(ymax, v); }));
  if (ymax === ymin) { ymax += 1e-6; ymin -= 1e-6; }
  const X = x => m.l + (x - xs[0]) / (xs[xs.length - 1] - xs[0]) * (W - m.l - m.r), Y = y => H - m.b - (y - ymin) / (ymax - ymin) * (H - m.t - m.b);
  ctx.strokeStyle = '#9aa1ab'; ctx.strokeRect(m.l, m.t, W - m.l - m.r, H - m.t - m.b);
  ctx.fillStyle = '#6b7280'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(studyLabel(resultData), W / 2, H - 8); ctx.fillText(xs[0], X(xs[0]), H - m.b + 14); ctx.fillText(xs[xs.length - 1], X(xs[xs.length - 1]), H - m.b + 14);
  ctx.textAlign = 'right'; ctx.fillText(ymin.toFixed(4), m.l - 4, Y(ymin) + 4); ctx.fillText(ymax.toFixed(4), m.l - 4, Y(ymax) + 4);
  ctx.textAlign = 'left'; ctx.fillText('n_eff', m.l + 4, m.t - 6);
  const palette = ['#2f6fed', '#e8590c', '#0b7a5a', '#8e44ad'];
  for (let j = 0; j < nm; j++) { ctx.strokeStyle = palette[j % 4]; ctx.fillStyle = palette[j % 4]; ctx.lineWidth = 1.5; ctx.beginPath();
    xs.forEach((x, i) => i ? ctx.lineTo(X(x), Y(ys[i][j])) : ctx.moveTo(X(x), Y(ys[i][j]))); ctx.stroke();
    xs.forEach((x, i) => { ctx.beginPath(); ctx.arc(X(x), Y(ys[i][j]), 3, 0, 7); ctx.fill(); }); }
}
function fillResultTable() {
  if (!resultData) {
    $('resTable').innerHTML = ''; $('componentLabel').hidden = true;
    $('ptSel').innerHTML = ''; $('modeSel').innerHTML = ''; $('componentSel').value = 'magnitude';
    $('resInfo').textContent = 'no results available'; return;
  }
  const nm = resultData.neff[0].length, ng = resultData.group_index;
  const tracked = !!resultData.summary.mode_tracking, ngCount = ng ? (tracked ? nm : 1) : 0;
  let h = '<div id="resultTableScroll" class="result-table-scroll" tabindex="0" role="region" aria-label="Mode results"><table class="res"><tr><th>' + studyLabel(resultData) + '</th>' + Array.from({ length: nm }, (_, j) => `<th>n_eff ${tracked ? 'branch ' : ''}${j + 1}</th>`).join('') + Array.from({ length: ngCount }, (_, j) => `<th>n_g ${tracked ? 'branch ' : ''}${j + 1}</th>`).join('') + '</tr>';
  resultData.values.forEach((v, i) => { h += `<tr><td>${v}</td>` + resultData.neff[i].map(x => `<td>${x.toFixed(6)}</td>`).join('') + Array.from({ length: ngCount }, (_, j) => `<td>${ng[i][j].toFixed(4)}</td>`).join('') + '</tr>'; });
  h += '</table></div>';
  if (tracked) h += '<div class="hint" style="margin:0 10px">Branch numbers follow the modes seeded at the first wavelength. Refine the wavelength spacing to check group-index accuracy.</div>';
  const t = resultData.timings; h += `<div class="hint" style="margin:0 10px">mesh ${t.mesh.toFixed(2)} s, solve ${t.solve.toFixed(2)} s</div>`;
  $('resTable').innerHTML = h;
}
function physKey() { return Object.keys(doc.physics)[0]; }
let unitVocab = null;
function unitSummary() { const u = doc.units || {}; const k = Object.keys(u); return k.length ? k.map(d => `${d} ${typeof u[d] === 'string' ? u[d] : 'custom'}`).join(', ') : 'none declared'; }
function populateResultSelectors() {
  $('componentLabel').hidden = !resultData.vector_fields;
  $('componentSel').value = 'magnitude';
  $('ptSel').innerHTML = resultData.values.map((v, i) => `<option value="${i}">${studyLabel(resultData)} = ${v}</option>`).join('');
  $('ptSel').value = Math.floor(resultData.values.length / 2);
  $('modeSel').innerHTML = resultData.neff[0].map((_, j) => `<option value="${j}">${resultData.summary.mode_tracking ? 'branch ' : ''}${j + 1}</option>`).join('');
}

// ------------------------------------------------------------------ tree
function buildTree() {
  const t = $('tree'); t.innerHTML = '';
  const node = (id, label, lvl = 0, icon = '') => { const d = document.createElement('div'); d.className = `node lvl${lvl}` + (selected === id ? ' sel' : ''); d.dataset.id = id;
    d.innerHTML = `<span class="ic">${icon}</span>${label}`; d.onclick = () => { selected = id; buildTree(); renderProps(); drawGeometry(); if (id === 'results') showTab('results'); if (id === 'mesh') showTab('mesh'); if (id.startsWith('shape') || id.startsWith('geometry')) showTab('geometry'); }; t.appendChild(d); };
  node('model', doc.name || 'model', 0, '▣');
  node('geometry', 'Geometry', 0, '▾'); node('geometry.domain', 'Domain', 1, '□'); node('geometry.background', `Background · ${doc.geometry.background.material}`, 1, '▨');
  doc.geometry.shapes.forEach((s, i) => node(`shape:${i}`, `${s.name} · ${s.type} · ${s.material}`, 1, '◇'));
  const add = document.createElement('div'); add.className = 'add'; add.innerHTML = '<button>+ shape</button>'; add.querySelector('button').onclick = addShape; t.appendChild(add);
  node('units', `Units · ${unitSummary()}`, 0, '⊛');
  node('materials', 'Materials', 0, '▾');
  Object.keys(doc.materials).forEach(k => node(`material:${k}`, `${k} · ${doc.materials[k].sellmeier ? 'Sellmeier' : 'n=' + doc.materials[k].n}`, 1, '◈'));
  const addm = document.createElement('div'); addm.className = 'add'; addm.innerHTML = '<button>+ custom material</button>'; addm.querySelector('button').onclick = addMaterial; t.appendChild(addm);
  Object.keys(doc.physics).forEach(k => node(`physics:${k}`, `Physics ${k} · ${doc.physics[k].type}`, 0, '∿')); node('mesh', 'Mesh', 0, '△'); node('study', `Study · ${doc.study.type}`, 0, '⇶'); node('results', 'Results', 0, '▤');
}
function addShape() { const n = doc.geometry.shapes.length; doc.geometry.shapes.push({ name: `shape${n + 1}`, type: 'rect', x: 0, y: 0, w: 0.5, h: 0.2, material: doc.geometry.background.material }); selected = `shape:${n}`; refresh(); }
function addMaterial() { let k = 'custom'; let i = 1; while (doc.materials[k]) k = `custom${i++}`; doc.materials[k] = { n: 1.5, k: 0 }; selected = `material:${k}`; refresh(); }

// ------------------------------------------------------------------ properties panel
function materialOptions(current) {
  const names = [...Object.keys(doc.materials), ...materials.map(m => m.name)];
  if (!names.includes(current)) names.unshift(current);
  return names.map(n => `<option ${n === current ? 'selected' : ''}>${n}</option>`).join('');
}
function row(label, inputHtml) { return `<div class="row"><label>${label}</label>${inputHtml}</div>`; }
function num(path, v, step = 'any') { return `<input type="number" step="${step}" data-path="${path}" value="${v}">`; }
function txt(path, v) { return `<input type="text" data-path="${path}" value="${String(v).replace(/"/g, '&quot;')}">`; }
function sel(path, v, opts) { return `<select data-path="${path}">${opts.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`; }

function renderProps() {
  const P = $('props'); let h = '';
  if (selected === 'model') h = '<h3>Model</h3>' + row('name', txt('name', doc.name)) + `<div class="hint">OpenPhysics format ${doc.openphysics}, lengths in ${lengthUnit()}</div>`;
  else if (selected === 'geometry') h = '<h3>Geometry</h3><div class="hint">Shapes are stacked in order: later shapes cut earlier ones; the background fills the rest. Select a shape or add one.</div>';
  else if (selected === 'geometry.domain') { const d = doc.geometry.domain; h = '<h3>Domain</h3>' + ['xmin', 'xmax', 'ymin', 'ymax'].map(k => row(k, num(`geometry.domain.${k}`, d[k]))).join(''); }
  else if (selected === 'geometry.background') { const b = doc.geometry.background; h = '<h3>Background</h3>' + row('material', `<select data-path="geometry.background.material">${materialOptions(b.material)}</select>`) + row('mesh size', num('geometry.background.mesh_size', b.mesh_size ?? '')) + matHint(b.material); }
  else if (selected.startsWith('shape:')) {
    const i = +selected.split(':')[1], s = doc.geometry.shapes[i]; const p = `geometry.shapes.${i}`;
    h = `<h3>Shape ${i + 1}</h3>` + row('name', txt(`${p}.name`, s.name)) + row('type', sel(`${p}.type`, s.type, ['rect', 'circle', 'polygon']));
    if (s.type === 'rect') h += ['x', 'y', 'w', 'h'].map(k => row(k, num(`${p}.${k}`, s[k]))).join('');
    else if (s.type === 'circle') h += ['cx', 'cy', 'r'].map(k => row(k, num(`${p}.${k}`, s[k]))).join('');
    else h += row('points', `<input type="text" data-path="${p}.points" data-kind="points" value="${s.points.map(q => q.join(',')).join('; ')}">`) + '<div class="hint">x,y pairs separated by ;</div>';
    h += row('material', `<select data-path="${p}.material">${materialOptions(s.material)}</select>`) + row('mesh size', num(`${p}.mesh_size`, s.mesh_size ?? '')) + matHint(s.material);
    h += `<div class="actions"><button data-act="up">▲ up</button><button data-act="down">▼ down</button><button data-act="del" class="danger">delete</button></div>`;
  }
  else if (selected === 'materials') h = '<h3>Materials</h3><div class="hint">Names not defined here are looked up in physmat (' + materials.length + ' built-ins with dispersion). Add a custom constant material with + custom material.</div>' +
    '<div class="hint">' + materials.map(m => `<b>${m.name}</b> ${m.range_um[0]}–${m.range_um[1] ?? '∞'} um`).join('<br>') + '</div>';
  else if (selected.startsWith('material:')) { const k = selected.slice(9), m = doc.materials[k];
    h = `<h3>Custom material</h3>` + row('name', `<input type="text" data-kind="matname" data-old="${k}" value="${k}">`);
    h += m.sellmeier ? `<div class="hint">Sellmeier dispersion. Edit B, C, A and range in the JSON tab. C uses squared document length; range uses ${lengthUnit()}.</div>` : row('n', num(`materials.${k}.n`, m.n)) + row('k', num(`materials.${k}.k`, m.k ?? 0));
    h += `<div class="actions"><button data-act="delmat" class="danger">delete</button></div>`; }
  else if (selected.startsWith('physics:')) { const pk = selected.slice(8), p = doc.physics[pk]; h = `<h3>Physics · ${pk}</h3>` + row('type', sel(`physics.${pk}.type`, p.type, ['em.modes2d'])) + row('formulation', sel(`physics.${pk}.formulation`, p.formulation, ['scalar', 'vector'])) +
    row(`wavelength (${lengthUnit()})`, num(`physics.${pk}.wavelength`, p.wavelength)) + row('num modes', num(`physics.${pk}.num_modes`, p.num_modes, 1)) +
    (p.formulation === 'vector' ? row('cladding index', num(`physics.${pk}.n_cladding`, p.n_cladding ?? '')) +
      '<div class="hint">Set the exterior guiding threshold (e.g. the highest substrate or cover index), valid throughout the study. Vector: lossless dielectrics, single points or wavelength sweeps of isolated modes. PEC fixes tangential E; PMC is natural. Use vector_slab for the TE example.</div>' :
      '<div class="hint">Scalar: exact for TE slabs, approximate for 2D high-contrast cores. PEC sets the scalar field to zero; PMC is natural.</div>') +
    '<h3 style="margin-top:12px">Boundaries</h3>' +
    ['left', 'right', 'top', 'bottom'].map(k => row(k, sel(`physics.${pk}.boundary.${k}`, p.boundary[k], ['pec', 'pmc']))).join(''); }
  else if (selected === 'units') {
    const u = doc.units || {}; const dims = unitVocab ? unitVocab.dimensions : Object.keys(u);
    h = '<h3>Units</h3><div class="hint">What the numbers in this document mean. A dimension left at SI is SI; the physics still requires the ones it reads, so those cannot be left out.</div>';
    h += dims.map(d => {
      const syms = unitVocab ? unitVocab.symbols[d] : [];
      const cur = typeof u[d] === 'string' ? u[d] : '';
      const opts = ['<option value="">SI</option>'].concat(syms.map(x => `<option${x === cur ? ' selected' : ''}>${x}</option>`)).join('');
      return row(d, `<select data-kind="unit" data-dim="${d}">${opts}</select>`);
    }).join('');
    if (Object.values(u).some(v => typeof v !== 'string')) h += '<div class="hint">This document uses a numeric escape hatch for at least one dimension; edit it in the JSON view.</div>'; }
  else if (selected === 'mesh') { const m = doc.mesh; const g = m.grading; h = '<h3>Mesh</h3>' + row('size', num('mesh.size', m.size)) + row('min angle', num('mesh.min_angle', m.min_angle ?? 28)) +
    row('grading', `<select data-kind="grading"><option ${g ? '' : 'selected'}>off</option><option ${g ? 'selected' : ''}>on</option></select>`);
    if (g) h += row('center x', num('mesh.grading.center.0', g.center[0])) + row('center y', num('mesh.grading.center.1', g.center[1])) + row('near', num('mesh.grading.near', g.near)) + row('far', num('mesh.grading.far', g.far)) + row('distance', num('mesh.grading.distance', g.distance));
    h += '<div class="hint">Per-shape sizes are set on each shape. Grading grows the size linearly from near (at center) to far (at distance).</div>'; }
  else if (selected === 'study') { const s = doc.study; h = '<h3>Study</h3>' + row('type', sel('study.type', s.type, ['single', 'sweep']));
    if (s.type === 'sweep') h += row('parameter', txt('study.parameter', s.parameter ?? `physics.${physKey()}.wavelength`)) + row('values', `<input type="text" data-path="study.values" data-kind="list" value="${(s.values || []).join(', ')}">`) + '<div class="hint">The mesh is fixed throughout the study. Scalar studies can sweep physics parameters. Vector studies can sweep only wavelength, with at least three finite positive values in strictly increasing or decreasing order. Isolated modes are tracked between points; missing, ambiguous or nearly degenerate modes stop the run. Advanced study.tracking settings are available in JSON. Refine wavelength spacing to check group-index accuracy.</div>'; }
  else if (selected === 'results') h = '<h3>Results</h3><div class="hint">Run writes n_eff and fields per study point. Wavelength sweeps also report group index; vector sweeps require successful mode tracking at every point. Branch numbers follow the first point, and field info reports overlap with the preceding point. Use the point, mode and component selectors above the field view.</div>';
  P.innerHTML = h;
  P.querySelectorAll('[data-path]').forEach(el => el.addEventListener('change', onPropChange));
  P.querySelectorAll('[data-kind="unit"]').forEach(el => el.addEventListener('change', e => {
    const d = e.target.dataset.dim, v = e.target.value;
    doc.units = doc.units || {};
    if (v) doc.units[d] = v; else delete doc.units[d];
    meshData = null; refresh();
  }));
  P.querySelectorAll('[data-kind="matname"]').forEach(el => el.addEventListener('change', renameMaterial));
  P.querySelectorAll('[data-kind="grading"]').forEach(el => el.addEventListener('change', e => { invalidateDocument(); doc.mesh.grading = e.target.value === 'on' ? { center: [0, 0], near: doc.mesh.size / 5, far: doc.mesh.size, distance: 1 } : null; refresh(); }));
  P.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', onAction));
}
function matHint(name) { const m = materials.find(x => x.name === name || x.aliases.includes(name)); if (m) return `<div class="hint">${m.source}<br>valid ${m.range_um[0]}–${m.range_um[1] ?? '∞'} um</div>`;
  if (doc.materials[name]) return `<div class="hint">custom ${doc.materials[name].sellmeier ? 'Sellmeier' : 'constant'} material</div>`; return `<div class="hint" style="color:#b42318">unknown material</div>`; }

function setPath(obj, path, value) { const parts = path.split('.'); let o = obj; for (const p of parts.slice(0, -1)) o = o[p]; const last = parts[parts.length - 1];
  if (value === '' || value === null) delete o[last]; else o[last] = value; }
function onPropChange(e) {
  invalidateDocument();
  const el = e.target, path = el.dataset.path; let v = el.value;
  if (el.dataset.kind === 'list') v = v.split(/[,\s]+/).filter(Boolean).map(Number);
  else if (el.dataset.kind === 'points') v = v.split(';').map(s => s.trim()).filter(Boolean).map(s => s.split(',').map(Number));
  else if (el.type === 'number') v = v === '' ? '' : Number(v);
  if (path.endsWith('.type') && path.startsWith('geometry.shapes')) { const s = doc.geometry.shapes[+path.split('.')[2]]; const c = shapeCenter(s);
    if (v === 'rect') Object.assign(s, { x: c[0] - .25, y: c[1] - .1, w: .5, h: .2 }); if (v === 'circle') Object.assign(s, { cx: c[0], cy: c[1], r: .5 }); if (v === 'polygon') s.points = [[c[0] - .5, c[1] - .5], [c[0] + .5, c[1] - .5], [c[0], c[1] + .5]];
    for (const k of ['x', 'y', 'w', 'h', 'cx', 'cy', 'r', 'points']) if (!({ rect: ['x', 'y', 'w', 'h'], circle: ['cx', 'cy', 'r'], polygon: ['points'] })[v].includes(k)) delete s[k]; }
  setPath(doc, path, v);
  if (path === 'study.type' && v === 'sweep' && !doc.study.values) { doc.study.parameter = `physics.${physKey()}.wavelength`; doc.study.values = [1.5, 1.55, 1.6]; }
  meshData = null; refresh();
}
function renameMaterial(e) { const old = e.target.dataset.old, nw = e.target.value.trim(); if (!nw || nw === old || doc.materials[nw]) return; invalidateDocument(); doc.materials[nw] = doc.materials[old]; delete doc.materials[old];
  doc.geometry.shapes.forEach(s => { if (s.material === old) s.material = nw; }); if (doc.geometry.background.material === old) doc.geometry.background.material = nw; selected = `material:${nw}`; refresh(); }
function onAction(e) {
  invalidateDocument();
  const act = e.target.dataset.act;
  if (selected.startsWith('shape:')) { const i = +selected.split(':')[1], arr = doc.geometry.shapes;
    if (act === 'del') { arr.splice(i, 1); selected = 'geometry'; }
    if (act === 'up' && i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; selected = `shape:${i - 1}`; }
    if (act === 'down' && i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; selected = `shape:${i + 1}`; } }
  if (act === 'delmat') { delete doc.materials[selected.slice(9)]; selected = 'materials'; }
  meshData = null; refresh();
}

// ------------------------------------------------------------------ tabs, refresh, io
function showTab(name) { document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.view > div').forEach(d => d.classList.toggle('on', d.id === `tab-${name}`)); redrawAll(); }
function redrawAll() {
  if (isHeadlessThermal()) {
    for (const id of ['geoCanvas', 'meshCanvas', 'fieldCanvas', 'sweepCanvas']) {
      const cv = $(id); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
    }
    return;
  }
  drawGeometry(); drawMesh(); drawField(); drawSweep();
}
function refresh() {
  $('json').value = JSON.stringify(doc, null, 2);
  if (isHeadlessThermal()) {
    const physicsType = Object.values(doc.physics).find(p => isHeadlessThermalType(p?.type)).type;
    clearResultViews(); $('tree').innerHTML = ''; $('props').textContent = `${physicsType} is headless Python/CLI only; Studio does not support heat input or results.`;
    $('runBtn').disabled = $('meshBtn').disabled = true;
    status('headless thermal document unsupported in Studio'); redrawAll(); return;
  }
  $('runBtn').disabled = $('meshBtn').disabled = false;
  buildTree(); renderProps(); redrawAll();
}

async function loadExample(name) {
  const revision = invalidateDocument(), data = await api.get(`/api/examples/${name}`);
  if (revision !== documentRevision) return;
  doc = data; selected = 'model'; refresh(); log(`loaded example ${name}`);
}
async function doValidate() {
  if (isHeadlessThermal()) { invalidateDocument(); refresh(); return false; }
  const revision = documentRevision, r = await api.post('/api/validate', { doc });
  if (revision !== documentRevision) return false;
  if (r.ok) { doc = r.doc; refresh(); log('valid:\n' + r.summary); (r.notes || []).forEach(n => log('warning: ' + n, 'err')); status('valid'); }
  else { invalidateDocument(); log('invalid: ' + r.error, 'err'); status('invalid document'); }
  return r.ok;
}
async function doMesh() {
  if (isHeadlessThermal()) { invalidateDocument(); refresh(); return; }
  const revision = invalidateDocument(); status('meshing…'); $('meshBtn').disabled = true;
  try { const data = await api.post('/api/mesh', { doc }); if (revision !== documentRevision) return;
    meshData = data; showTab('mesh'); status(`mesh: ${meshData.stats.triangles} triangles`); log(`mesh: ${meshData.stats.nodes} nodes, ${meshData.stats.triangles} triangles, min angle ${meshData.stats.min_angle}°`); }
  catch (e) { if (revision === documentRevision) { log('mesh failed: ' + e.message, 'err'); status('mesh failed'); } }
  finally { if (revision === documentRevision) $('meshBtn').disabled = false; }
}
async function doRun() {
  if (isHeadlessThermal()) { invalidateDocument(); refresh(); return; }
  const revision = invalidateDocument();
  status('running…'); $('runBtn').disabled = true;
  try { const r = await api.post('/api/run', { doc }); if (revision !== documentRevision) return;
    const job = r.job; currentJob = job; $('jobInfo').textContent = `job ${job}`; let shown = 0;
    while (revision === documentRevision && currentJob === job) {
      await new Promise(res => setTimeout(res, 500));
      if (revision !== documentRevision || currentJob !== job) return;
      const j = await api.get(`/api/jobs/${job}`);
      if (revision !== documentRevision || currentJob !== job) return;
      for (; shown < j.log.length; shown++) log(j.log[shown]);
      if (j.status === 'done') { const data = await api.get(`/api/jobs/${job}/result`);
        if (revision !== documentRevision || currentJob !== job) return;
        if (isHeadlessThermalType(data.summary?.physics_type)) throw new Error('Studio cannot render headless thermal results');
        resultData = data; populateResultSelectors(); fillResultTable(); showTab('results'); status('done'); break; }
      if (j.status === 'error') { log(j.error, 'err'); status('run failed'); break; } } }
  catch (e) { if (revision === documentRevision) { log('run failed: ' + e.message, 'err'); status('run failed'); } }
  finally { if (revision === documentRevision) $('runBtn').disabled = false; }
}

$('loadExample').onclick = () => loadExample($('exampleSel').value);
$('validate').onclick = doValidate;
$('meshBtn').onclick = doMesh;
$('runBtn').onclick = doRun;
$('download').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 2)], { type: 'application/json' })); a.download = (doc.name || 'model').replace(/[^\w.-]+/g, '_') + '.json'; a.click(); };
$('openFile').onclick = () => $('fileInput').click();
$('fileInput').onchange = async e => { const f = e.target.files[0]; if (!f) return; const revision = invalidateDocument();
  try { const data = JSON.parse(await f.text()); if (revision !== documentRevision) return;
    doc = data; selected = 'model'; refresh(); await doValidate(); log(`opened ${f.name}`); }
  catch (err) { if (revision === documentRevision) log('could not open: ' + err.message, 'err'); } };
$('applyJson').onclick = async () => { invalidateDocument(); try { doc = JSON.parse($('json').value); selected = 'model'; refresh(); await doValidate(); } catch (err) { log('JSON error: ' + err.message, 'err'); } };
$('json').oninput = () => invalidateDocument();
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
$('ptSel').onchange = drawField; $('modeSel').onchange = drawField;
$('componentSel').onchange = drawField;
window.addEventListener('resize', redrawAll);

(async function init() {
  try { const ex = await api.get('/api/examples'); $('exampleSel').innerHTML = ex.examples.map(n => `<option>${n}</option>`).join(''); $('exampleSel').value = 'soi_strip';
    materials = (await api.get('/api/materials')).materials; unitVocab = await api.get('/api/units'); await loadExample('soi_strip'); }
  catch (e) { log('startup failed: ' + e.message, 'err'); }
})();
</script>
</body>
</html>
