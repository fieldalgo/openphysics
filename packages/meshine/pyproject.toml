[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshine"
version = "0.1.0"
description = "Quality triangle mesher for multi-material planar domains (constrained Delaunay refinement)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Yongha Kim" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/FieldAlgo/openphysics/tree/main/packages/meshine"
Repository = "https://github.com/FieldAlgo/openphysics/tree/main/packages/meshine"
Issues = "https://github.com/FieldAlgo/openphysics/issues"

[project.optional-dependencies]
test = ["pytest"]
plot = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["meshine*"]
