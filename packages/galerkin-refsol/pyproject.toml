[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "galerkin-refsol"
version = "0.1.0"
description = "Reference solutions and published benchmarks for validating the galerkin finite-element engine"
dynamic = ["readme"]  # README.md with absolute links, built by setup.py
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yongha Kim" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/fieldalgo/openphysics/tree/main/packages/galerkin-refsol"
Repository = "https://github.com/fieldalgo/openphysics/tree/main/packages/galerkin-refsol"
Issues = "https://github.com/fieldalgo/openphysics/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["refsol*"]
