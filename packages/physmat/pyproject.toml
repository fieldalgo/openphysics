[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "physmat"
version = "0.1.0"
description = "Material properties for physics solvers: optical dispersion models, built-in materials with sources, refractiveindex.info reader, Drude-Lorentz fitting"
dynamic = ["readme"]  # README.md with absolute links, built by setup.py
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yongha Kim" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/fieldalgo/openphysics/tree/main/packages/physmat"
Repository = "https://github.com/fieldalgo/openphysics/tree/main/packages/physmat"
Issues = "https://github.com/fieldalgo/openphysics/issues"

[project.optional-dependencies]
rii = ["pyyaml"]
test = ["pytest", "pyyaml"]
plot = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["physmat*"]
