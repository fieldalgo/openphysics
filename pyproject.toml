# Root configuration for the multiphysics monorepo.
#
# This file declares no distribution. Each package under packages/<name>/ has its own
# pyproject.toml, its own PyPI name and its own version; this root exists so that one
# pytest invocation covers the whole stack.
#
# pytest reads exactly one configuration file, so every marker any package uses must be
# declared here.

[tool.pytest.ini_options]
# Tests live outside the packages, one folder per import package (tests/<name>/),
# so nothing a test uses can enter a distribution. tools/tests/ tests the
# repository tools and runs from the source tree only.
testpaths = ["tests", "tools/tests"]
markers = ["slow: convergence studies that take more than a few seconds"]
